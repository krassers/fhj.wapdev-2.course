<h2>{{ id() ? 'Edit movie' : 'New movie' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-form-field>
    <mat-label>Title</mat-label>
    <input matInput formControlName="title" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Released</mat-label>
    <input matInput [matDatepicker]="releasedPicker" formControlName="released" />
    <mat-datepicker-toggle matIconSuffix [for]="releasedPicker"></mat-datepicker-toggle>
    <mat-datepicker #releasedPicker></mat-datepicker>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Rank</mat-label>
    <input matInput type="number" formControlName="rank" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="description"></textarea>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Runtime (minutes)</mat-label>
    <input matInput type="number" formControlName="run_time" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Rating</mat-label>
    <input matInput type="number" step="0.1" formControlName="rating" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Genres</mat-label>
    <mat-select multiple formControlName="genres">
      @for (genre of genres(); track genre.id) {
        <mat-option [value]="genre.id">{{ genre.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <!-- Fixed choices for now. Part 2 searches the backend. -->
  <mat-form-field>
    <mat-label>Director</mat-label>
    <mat-select formControlName="director">
      <mat-option [value]="5">James Gunn</mat-option>
      <mat-option [value]="10">Ridley Scott</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Actors</mat-label>
    <mat-select multiple formControlName="actors">
      <mat-option [value]="1">Chris Pratt</mat-option>
      <mat-option [value]="2">Vin Diesel</mat-option>
    </mat-select>
  </mat-form-field>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <button matButton="filled" type="submit">Save</button>
</form>
