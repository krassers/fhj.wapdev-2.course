<h1>{{ title() }}</h1>

<app-alert-button buttonText="Click me" alertMessage="Custom message"></app-alert-button>

<div class="news-list">
  @for (entry of news; track entry.title) {
    <app-fh-news
      [title]="entry.title"
      [description]="entry.description"
      [date]="entry.date"
      [image]="entry.image"
    ></app-fh-news>
  }
</div>
